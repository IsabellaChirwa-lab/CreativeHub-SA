version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: creativehub_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: creativehub
      POSTGRES_PASSWORD: creativehub_dev_pw
      POSTGRES_DB: creativehub
    ports:
      - "5432:5432"
    volumes:
      - creativehub_pgdata:/var/lib/postgresql/data

volumes:
  creativehub_pgdata:
